[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxie-production-os"
version = "0.3.0"
description = "Control plane for Voxie's Wonder World production: canon, timing, manifests, benchmarks, QC, and timeline adapters."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0", "tzdata>=2026.1"]

[project.optional-dependencies]
timeline = ["opentimelineio==0.18.1"]
test = ["pytest>=9.0"]

[project.scripts]
voxie-os = "voxie_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
