classification_rules:
  - "Ambiguous assets stay in the unsorted inbox; do not infer identity from filename alone."
  - "Only explicit approved/locked assets may enter Masters or Canon."
  - "Draft, source, and visually identified production clips go to Active unless a stronger status is established."
  - "Duplicate candidates are quarantined for review; do not delete automatically."
  - "Large image/audio/video binaries remain outside Git and are referenced by manifests."
  - "Use stable semantic asset IDs and checksums when authoritative identity is known."

