canon_version: status-register-v2
register_id: VWW-CHARACTER-STATUS-V02
register_status: ACTIVE
recorded_date: '2026-09-10'
supersedes:
  register_id: VWW-CHARACTER-STATUS-V01
  path: manifests/characters/status-register-v01.yaml
  preservation_state: historical_unchanged
authority_scope: >-
  Status and routing authority for character identity work. This register does not
  create, redesign, or promote character pixels. Locked traits may not be silently
  changed, recolored, substituted, or overwritten.
status_categories:
  - LOCKED_CANON
  - APPROVED_BUT_UNLOCKED
  - PARKED_ALTERNATIVE
  - NEEDS_RECONCILIATION
characters:
  - character_id: VOXIE
    name: Voxie
    lock_level: hard
    status_category: LOCKED_CANON
    production_use: ALLOWED_WITH_LOCK
    identity_rules:
      - Preserve exactly one Voxie per production shot with exactly two arms and exactly two legs.
      - Preserve the glossy dark-indigo visor and luminous cyan eyes, brows, and mouth.
      - Preserve the centered forehead V and cyan chest core.
      - Preserve the round helmet and round lateral ear discs; no pointy ears.
      - Preserve the white and dark-indigo segmented armor and exact V2 silhouette and colors.
      - Preserve exactly four translucent wings, with the upper pair larger and longer than the lower pair.
      - Preserve segmented thigh and shin armor and distinct ankle and foot armor with rounded purple toe and sole.
      - Preserve exactly four digits per hand, comprising three fingers and one thumb.
      - Do not add limbs, wings, accessories, costume changes, recolors, or proportion drift.
    reference_assets:
      - manifests/assets/voxie-canon-v2-v13.yaml
    historical_assets:
      - path: manifests/assets/voxie-canon-v1.0.magiclight.yaml
        state: HISTORICAL_LOCKED
        permitted_use: EXISTING_APPROVED_V1_ERA_PRODUCTIONS_ONLY
    forbidden_assets:
      - Voxie.png
    integrity_note: >-
      Canon V2 v13 is bound to one preserved Library package and eight exact
      filenames and SHA-256 hashes. New visual-story work must use the
      angle-appropriate V2 v13 view; the V1 side anchor is not authority for
      new side, turn, walk, or stepping generation.
    pending_change_proposals:
      - proposal_id: VOXIE_CANON_V14
        status: PENDING_CANON_CHANGE_GATE
        requested_changes:
          - five digits per hand, comprising four fingers and one thumb
          - white rear helmet shell
        authority_effect: NONE_UNTIL_SEPARATELY_APPROVED_AND_LOCKED
    parked_alternatives:
      - name: Bubble Voxie
        status_category: PARKED_ALTERNATIVE
        permitted_uses:
          - younger form
          - magical intro or transformation
          - dream or play variant
          - future distinct character seed
        may_replace_locked_canon: false
    next_gate: USE_CANON_V2_V13_LOCKED_AUTHORITY_ONLY
  - character_id: LUMI
    name: Lumi the Wonder Scout
    lock_level: layered
    status_category: APPROVED_BUT_UNLOCKED
    production_use: BLOCKED_UNTIL_PREVIEW_LOCK
    identity_rules:
      - Preserve the explorer-scout role and separate identity from Voxie.
      - Preserve the explorer suit, dark visor face, luminous blue expressions, glowing star chest medallion, and translucent blue-light cape or wings.
      - Preserve the observant, optimistic, and cautious personality profile.
      - Do not treat Lumi as a Voxie recolor or production-specific costume.
    reference_assets: []
    forbidden_assets: []
    evidence:
      - Command Center name and profile approval recorded 2026-08-27.
    blockers:
      - NO_APPROVED_PROVIDER_PREVIEW
      - NO_REUSABLE_ASSET_ID
      - NO_LOCKED_REFERENCE_PACKAGE
    next_gate: CREATE_PREVIEW_THEN_REQUIRE_EXPLICIT_LOCK_APPROVAL
  - character_id: NAVI
    name: Navi
    lock_level: experimental
    status_category: NEEDS_RECONCILIATION
    production_use: BLOCKED_UNTIL_RECONCILED
    identity_rules:
      - Keep the robotic-fairy branch and organic leaf-fairy branch separate until an explicit reconciliation decision.
      - Do not merge traits across branches or silently select one as global canon.
      - Preserve each completed production exactly as historical production evidence.
    reference_assets: []
    forbidden_assets: []
    branches:
      - branch_id: NAVI_ROBOTIC_FAIRY
        description: White and dark robotic fairy with cyan digital features, V emblem, chest diamond, and wings.
        status: HISTORICAL_PRODUCTION_BRANCH
      - branch_id: NAVI_ORGANIC_LEAF_FAIRY
        description: Teal-haired organic fairy with green leaf dress.
        status: HISTORICAL_PRODUCTION_BRANCH
    blockers:
      - MULTIPLE_ESTABLISHED_VISUAL_IDENTITIES
      - NO_SINGLE_GLOBAL_CANON_DECISION
    next_gate: EXPLICIT_BRANCH_RECONCILIATION_OR_SEPARATE_CHARACTER_DECISION
  - character_id: HUMPTY
    name: Humpty
    lock_level: experimental
    status_category: NEEDS_RECONCILIATION
    production_use: BLOCKED_UNTIL_RECONCILED
    identity_rules:
      - Keep the rainbow-patchwork and cream-blue-accessory branches separate until an explicit reconciliation decision.
      - Do not silently merge shell patterns, accessories, or proportions across productions.
      - Preserve completed-production appearances as historical evidence rather than global canon.
    reference_assets: []
    forbidden_assets: []
    branches:
      - branch_id: HUMPTY_RAINBOW_PATCHWORK
        description: Rainbow or patchwork Humpty design used with the robotic-fairy Navi branch.
        status: HISTORICAL_PRODUCTION_BRANCH
      - branch_id: HUMPTY_CREAM_BLUE
        description: Cream Humpty with blue bow and blue-yellow hat used with the organic-fairy Navi branch.
        status: HISTORICAL_PRODUCTION_BRANCH
    blockers:
      - MULTIPLE_ESTABLISHED_VISUAL_IDENTITIES
      - DUPLICATE_CHARACTER_DEFECT_IN_PARKED_PRODUCTION
      - NO_SINGLE_GLOBAL_CANON_DECISION
    next_gate: EXPLICIT_BRANCH_RECONCILIATION_OR_SEPARATE_CHARACTER_DECISION
