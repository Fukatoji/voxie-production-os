name: Production OS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[timeline,test]'
      - name: Test
        run: pytest -q
      - name: Validate tracked media fixtures
        run: voxie-os fixtures-check
      - name: Validate controlled examples and workflows
        run: |
          voxie-os validate canon examples/canon.voxie.v1.yaml
          voxie-os validate beatmap examples/beatmap.example.json
          voxie-os validate shot_manifest examples/shot_manifest.example.yaml
          voxie-os validate benchmark examples/benchmark.example.json
          voxie-os validate library_routing manifests/library-routing.v2.yaml
          voxie-os validate production_state manifests/productions/rainbow-colors/production-state-v01.yaml
          voxie-os validate production_state manifests/productions/rainbow-colors/production-state-v02.yaml
          voxie-os validate production_state manifests/productions/rainbow-colors/production-state-v03.yaml
          voxie-os validate benchmark_suite workflows/voxie-model-benchmark-v01.yaml
          voxie-os validate provider_catalog config/providers.v1.yaml
          voxie-os validate provider_job examples/provider-job.magiclight-character-preview.yaml
          voxie-os validate provider_job examples/provider-job.elevenlabs-voice-preview.yaml
          voxie-os validate provider_job examples/provider-job.higgsfield-animation.yaml
          voxie-os validate provider_job examples/provider-job.vidiq-audit.yaml
          voxie-os provider-plan config/providers.v1.yaml examples/provider-job.vidiq-audit.yaml
          voxie-os beatmap-audit manifests/productions/big-surprise/beatmap-001.final.json
      - name: Build read-only change report
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD^"; fi
          voxie-os change-report --base "$BASE" --head HEAD --out change-report.md
          cat change-report.md >> "$GITHUB_STEP_SUMMARY"
